- name: configuring frontend
  hosts: frontend
  become: true
  tasks:
  - name: enable nginx 1.2.4
    ansible.builtin.command: dnf module enable nginx:1.24 -y

  - name: install nginx
    ansible.builtin.dnf:
      name: nginx
      state: present

  - name: removing the html directory
    ansible.builtin.file:
      path: /usr/share/nginx/html/*
      state: absent

  - name: creating html directory
    ansible.builtin.file:
      path: /usr/share/nginx/html
      state: directory

  - name: Downloading frontend
    ansible.builtin.get_url:
      url: https://roboshop-artifacts.s3.amazonaws.com/frontend-v3.zip
      dest: /tmp/frontend.zip

  - name: uzipping the code
    ansible.builtin.unarchive:
      src: /tmp/frontend.zip
      dest: /usr/share/nginx/html
      remote_src: yes

  - name: removing default nginx conf
    ansible.builtin.file: 
      state: absent
      path: /etc/nginx/nginx.conf

  - name: copying nginx.conf
    ansible.builtin.template:
      src: nginx.conf
      dest: /etc/nginx/nginx.conf

  - name: restarting nginx
    ansible.builtin.service:
      name: nginx
      state: restarted
      enabled: yes

      