- name: create ec2 instances
  hosts: all
  connection: local
  vars:
    sg_id: sg-0ff061d19a895a55d
    ami_id: ami-0220d79f3f480ecf5
    domain_name: seshapudevops.online
    env: dev
    instances:
    - mongodb
    - catalogue
  tasks:
  - name: crearing aws ec2 instances
    amazon.aws.ec2_instance:
      instance_type: t3.micro
      image_id: "{{ ami_id }}"
      security_group: "{{ sg_id }}"
      name: "{{ item }}-{{ env }}"
      tags:
        Project: Roboshop
        Component: "{{ item }}"
        Environment: "{{ env }}"
        Name: "{{ item }}-{{ env }}"
    loop: "{{ instances }}"
    register: ec2_output

  - name: print the output
    ansible.builtin.debug:
      msg: "{{ ec2_output }}"

  - name: Creating route53 records
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "{{ item.item }}-{{env}}.{{ domain_name }}" # mongodb.seshapudevops.online
      type: A
      ttl: 1
      value: "{{ item.instances[0].private_ip_address }}"
      wait: true
  
  loop: {{ec2_output.results}}
