- name: create ec2 instances
  hosts: all
  connection: local
  vars:
    sg_id: sg-0ff061d19a895a55d
    ami_id: ami-0220d79f3f480ecf5
    domain_name: seshapudevops.online
    env: dev
    action: create
    instances:
    - mongodb
    - catalogue
  tasks:
  ###create
  - name: crearing aws ec2 instances
    amazon.aws.ec2_instance:
      instance_type: t3.micro
      image_id: "{{ ami_id }}"
      security_group: "{{ sg_id }}"
      name: "{{ item }}-{{ env }}"
      tags:
        Project: Roboshop
        Component: "{{ item }}"
        Environment: "{{ env }}"
        Name: "{{ item }}-{{ env }}"
    loop: "{{ instances }}"
    register: ec2_output
    when: action == "create"

  - name: print the output
    ansible.builtin.debug:
      msg: "{{ ec2_output }}"
    when: action == "create"

  - name: Creating route53 records
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "{{ item.item }}-{{env}}.{{ domain_name }}" # mongodb-dev.seshapudevops.online frontend-dev.seshapudevops.online
      type: A
      ttl: 1
      value: "{{ item.instances[0].private_ip_address }}"
      wait: false
      overwrite: true
    loop: "{{ec2_output.results}}"  # list
    when: 
      -action == "create"
      - item.item != "frontend"

  - name: Creating route53 records
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "roboshop-{{env}}.{{ domain_name }}" # roboshop-dev.seshapudevops.online
      type: A
      ttl: 1
      value: "{{ item.instances[0].public_ip_address }}"
      wait: false
      overwrite: true
    loop: "{{ec2_output.results}}"
    when: 
    - item.item == "frontend"
    - action == "create"


###Destroying
  - name: deleting the roure53 records for frontend
    amazon.aws.route53:
      state: absent
      zone: "{{ domain_name }}"
      record: "roboshop-{{env}}.{{ domain_name }}" # roboshop-dev.seshapudevops.online
      type: A
      ttl: 1
    loop: "{{ instances }}"
    when: 
    - item == "frontend"
    - action == "destroy"

  - name: deleting the roure53 records
    amazon.aws.route53:
      state: absent
      zone: "{{ domain_name }}"
      record: "item-{{env}}.{{ domain_name }}" # roboshop-dev.seshapudevops.online
      type: A
      ttl: 1
    loop: "{{ instances }}"
    when:
    - action == "destroy"

  - name: delete ec2 instance
    amazon.aws.ec2_instance:
      state: absent
      name: "{{ item }}-{{ env }}"
      wait: false
    loop: "{{ instances }}"
    when: action == "destroy"
