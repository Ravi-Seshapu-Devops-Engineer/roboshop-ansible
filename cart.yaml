- name: cart configuration
  hosts: cart
  become: true
  tasks:
  - name: enabling nodejs2 version
    ansible.builtin.command: dnf module enable nodejs:20 -y

  - name: installing nodejs
    ansible.builtin.dnf:
      name: nodejs
      state: present

  - name: creating system cart
    ansible.builtin.user:
      name: roboshop
      system: true
      home: /app
      shell: /sbin/nologin
      comment: roboshop system user

  - name: deleting the app directory
    ansible.builtin.file:
      path: /app
      state: absent

  - name: create app directory
    ansible.builtin.file:
      path: /app
      state: directory

  - name: deleting the zip file
    ansible.builtin.file:
      path: /tmp/cart.zip
      state: absent

  - name: Downloading cart
    ansible.builtin.get_url:
      url: https://roboshop-artifacts.s3.amazonaws.com/cart-v3.zip
      dest: /tmp/cart.zip

  - name: uzipping the code
    ansible.builtin.unarchive:
      src: /tmp/cart.zip
      dest: /app
      remote_src: yes

  - name: installing dependencies
    community.general.npm:
      path: /app

  - name: copying cart service
    ansible.builtin.template:
      src: cart.service
      dest: /etc/systemd/system/cart.service
      
  - name: daemon reload
    ansible.builtin.systemd_service:
      daemon_reload: true

  - name: starting cart
    ansible.builtin.service:
      name: cart
      state: restarted
      enabled: yes
